name: CI
on:
    push:
        branches:
            - afconvert

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3
      - name: Convert
        run: |
          afconvert -f caff -d opus 1ch.aif 1ch.opus.caf
          afconvert -f caff -d opus 2ch.flac 2ch.opus.caf
          afconvert -f caff -d flac 1ch.aif 1ch.flac.caf
          afconvert -f caff -d 0 2ch.flac 2ch.flac.caf
          afconvert -f caff -d 0 4ch.flac 4ch.flac.caf
          afconvert -f caff -d 0 5ch.flac 5ch.flac.caf
          afconvert -f caff -d 0 5.1ch.flac 5.1ch.flac.caf
          afconvert -f caff -d 0 6.1ch.flac 6.1ch.flac.caf
          afconvert -f caff -d 0 7.1ch.flac 7.1ch.flac.caf
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-results
          path: |
            *.caf
