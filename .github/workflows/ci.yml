name: CI
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install libfdk-aac
        run: sudo apt-get install libfdk-aac-dev
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: ./build/fdkaac -b 128 -R -o /dev/null /dev/null

  windows-msvc:
    strategy:
      matrix:
        arch: [x86, x64]
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Visual Studio developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure
        run: cmake -B build -G Ninja -DFDKAAC_BUILD_FDK_AAC=ON .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: .\build\fdkaac.exe -b 128 -R -o NUL NUL

  windows-clang:
    strategy:
      matrix:
        arch:
          - { short: "x86", long: "i686" }
          - { short: "x64", long: "x86_64" }
    runs-on: windows-latest
    env:
      CC: "clang-cl --target=${{ matrix.arch.long }}-pc-windows-msvc"
      CXX: "clang-cl --target=${{ matrix.arch.long }}-pc-windows-msvc"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Visual Studio developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch.short }}
      - name: Configure
        run: cmake -B build -G Ninja -DFDKAAC_BUILD_FDK_AAC=ON .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: .\build\fdkaac.exe -b 128 -R -o NUL NUL

  linux-clang-mingw:
    strategy:
      matrix:
        arch:
          - { short: "x86_64", triple: "x86_64-w64-mingw32" }
    runs-on: ubuntu-latest
    env:
      # https://github.com/mstorsjo/llvm-mingw/releases
      LLVM_MINGW_VERSION: "20260616"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install llvm-mingw
        run: |
          dir="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${dir}.tar.xz"
          tar xf llvm-mingw.tar.xz
          echo "$PWD/$dir/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=${{ matrix.arch.triple }}-clang \
            -DCMAKE_CXX_COMPILER=${{ matrix.arch.triple }}-clang++ \
            -DFDKAAC_BUILD_FDK_AAC=ON \
            .
      - name: Build
        run: cmake --build build

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DFDKAAC_BUILD_FDK_AAC=ON .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: ./build/fdkaac -b 128 -R -o /dev/null /dev/null

  msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        sys: [ clang64, mingw64, ucrt64 ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: git
          pacboy: >-
            cmake:p
            ninja:p
            cc:p
            pkg-config:p
            fdk-aac:p
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: ./build/fdkaac.exe -b 128 -R -o /dev/null /dev/null
